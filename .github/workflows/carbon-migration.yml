name: Carbon migration install and verification

on:
  push:
    branches:
      - feat/migrate-to-carbon-design-system

permissions:
  contents: write

concurrency:
  group: carbon-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Carbon dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh lockfile for Carbon dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
