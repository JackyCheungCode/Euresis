name: Euresis validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Initialize, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize vinext for Cloudflare
        run: npx vinext init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --skip-check

      - name: Install initialized dependencies
        run: npm install --no-audit --no-fund

      - name: Persist vinext initialization and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "build: persist vinext setup and lockfile [skip ci]"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Check vinext compatibility
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify production bundle and showcase route
        shell: bash
        run: |
          test -s .cloudflare/output/v1/workers/default/bundle/index.js
          test -s .cloudflare/output/v1/workers/default/bundle/ssr/index.js
          grep -R -q "Precision in" .cloudflare/output/v1/workers/default/bundle
          grep -R -q "Color system" .cloudflare/output/v1/workers/default/bundle
          grep -R -q "p-link" .cloudflare/output/v1/workers/default/bundle

      - name: Upload build output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euresis-build-output
          path: |
            .cloudflare/
            dist/
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Deploy Euresis Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize vinext for Cloudflare
        run: npx vinext init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --skip-check

      - name: Install initialized dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to the existing Euresis Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea4e98dce9c478d7dd5c07f10e5c722d
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deployment blocked. CLOUDFLARE_API_TOKEN is missing from Euresis GitHub Actions secrets."
            exit 1
          fi
          npm run build
          npx cf deploy --prebuilt --mode production --force
