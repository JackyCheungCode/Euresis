<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICP LeadFlow · 客户工作流控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/carbon.css">
</head>
<body>
  <header class="global-header">
    <div class="brand">
      <div class="logo">ICP</div>
      <span class="sep"></span>
      <span>LeadFlow</span>
      <span class="sep"></span>
      <span class="product">客户工作流控制台</span>
    </div>
    <div class="actions">
      <span><span class="status-dot"></span> 模拟运行中</span>
      <span>|</span>
      <span>DB: 已连接</span>
      <span>|</span>
      <span>v2.5.0</span>
    </div>
  </header>

  <div class="page-header">
    <div class="breadcrumb">
      <span>工作流</span><span>›</span><span>ICP 获客流水线</span><span>›</span><span class="current">模拟运行</span>
    </div>
    <h1>企业 ICP → 客户信息齐全</h1>
    <div class="subtitle">四层 ICP 字段体系：企业属性、联系人角色、购买信号、排除条件。</div>
  </div>

  <div class="main">
    <div class="stats-row" id="statsRow"></div>
    <div class="progress-steps" id="stepsNav"></div>
    <div id="stepContainer"></div>
    <div class="action-bar">
      <div class="action-info" id="actionInfo"></div>
      <div class="action-buttons">
        <button class="btn btn-ghost btn-sm" id="btnPrev">← 上一步</button>
        <button class="btn btn-secondary btn-sm" id="btnRerun">重新运行</button>
        <button class="btn btn-primary btn-sm" id="btnNext">下一步 →</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
